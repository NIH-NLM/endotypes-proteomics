# Environment for endotypes-proteomics.
#
# Linux, including the ADAPTS / Lifebit platform -- everything is a native binary:
#
#   mamba env create -f endotypes-proteomics.yml         (or micromamba / conda)
#   mamba activate endotypes-proteomics
#   Rscript -e 'IRkernel::installspec()'                 # register the R kernel
#   python -m bash_kernel.install                        # register the Bash kernel
#   jupyter lab
#
# Apple Silicon -- bioconda has no osx-arm64 build of r-wgcna, so build the whole
# environment for osx-64 and let Rosetta 2 run it:
#
#   CONDA_SUBDIR=osx-64 mamba env create -f endotypes-proteomics.yml
#   mamba activate endotypes-proteomics
#   conda config --env --set subdir osx-64               # pin later installs too
#   Rscript -e 'IRkernel::installspec()'
#   python -m bash_kernel.install
#   jupyter lab
#
# All analysis is R. JupyterLab, nbconvert and bash_kernel are Python packages,
# so conda pulls a Python interpreter in as their dependency -- it is the notebook
# host, not a language this project writes code in.
name: endotypes-proteomics
channels:
  - conda-forge
  - bioconda
  - nodefaults        # ignore the user's global `defaults` / pkgs/main channels.
                      # Solving against repo.anaconda.com as well made one install
                      # run for 88 minutes without finishing.
dependencies:
  # ── notebook host and kernels ───────────────────────────────────────────
  - jupyterlab
  - nbconvert                  # run_all.sh, the machine path
  - jupyter_core               # provides the `jupyter` command itself -- run_all.sh
                               # calls `jupyter nbconvert`, and without this the
                               # entry point arrives only as a jupyterlab dependency
  - r-irkernel                 # R kernel
  - bash_kernel                # Bash kernel

  # ── R ───────────────────────────────────────────────────────────────────
  - r-base=4.4.*

  # 00  batch correction
  - bioconductor-sva                      # ComBat

  # 01-03  soft threshold, modules, eigenproteins
  - r-wgcna                               # bioconda binary: linux-64 and osx-64.
                                          # No osx-arm64 build -- Apple Silicon must
                                          # create this env with CONDA_SUBDIR=osx-64.
  - r-dynamictreecut                      # WGCNA dependency, pinned so it is visible
  - r-fastcluster
  - r-hmisc                               # WGCNA dependency, as a binary rather
                                          # than something compiled at install time

  # ── the toolchain ───────────────────────────────────────────────────────
  # VarSelLCM is the one package installed from CRAN, and it contains C++.
  # conda's R invokes a conda compiler BY NAME (e.g. arm64-apple-darwin20.0.0-clang)
  # and reports "command not found" if it is absent, so a source install fails
  # without this. Everything else here is a prebuilt binary.
  - compilers

  # 05  patient clustering
  - r-cluster                             # silhouette

  # 06, 08  figures
  - bioconductor-complexheatmap
  - r-circlize

  # 04  reading proteins/*.json, the curated gene sets
  - r-jsonlite

  # support layer
  - r-fpc                                 # clusterboot, bootstrap Jaccard
  - bioconductor-impute                   # modulePreservation dependency
  - bioconductor-preprocesscore           # modulePreservation dependency

# ── NOT here, on purpose ──────────────────────────────────────────────────
# VarSelLCM has no conda package on any platform or subdir -- checked for both
# osx-arm64 and osx-64. It is installed from CRAN by ensure_pkg() in
# src/paths.R, which steps 04 and 12 call before library(). Guarded by
# requireNamespace(), so a second run is a no-op and touches no network.
#
# It contains C++, which is why `compilers` is declared above.
