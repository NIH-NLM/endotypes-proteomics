name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # One interpreter, matching the floor in pyproject.toml.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # pvclust-py is not on PyPI yet, so it is installed from source. Once it is
      # published this step goes away and the dependency resolves normally.
      - name: Install pvclust-py
        run: python -m pip install "pvclust-py @ git+https://github.com/NIH-NLM/pvclust-py.git@main"

      - name: Install
        run: python -m pip install -e ".[test]"

      - name: Run the tests
        run: pytest -q

      - name: Execute the notebooks
        run: python scripts/run_notebooks.py
