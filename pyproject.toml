[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kmeans-py"
version = "0.1.0"
description = "k-means clustering with approximately-unbiased (AU) p-values"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [{ name = "Anne Deslattes Mays", email = "adeslat@scitechcon.org" }]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy",
  "pandas",
  "scikit-learn",          # the k-means fit itself
  "typer",                 # CLI
  "pvclust-py",            # msfit, distance, hclust, io, plot -- shared, never copied
]

[project.optional-dependencies]
test = ["pytest", "inmoose"]
notebooks = ["jupyter", "matplotlib"]

[project.scripts]
kmeans-py = "kmeans_py.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
